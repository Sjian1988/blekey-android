name: 功能建议 / 兼容性反馈
description: 提出改进，或反馈你的车型 / 车盒固件上的适配结果
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        兼容性反馈对开源很有价值。若你在不同车型 / 固件上验证通过或发现协议差异，请尽量附抓包结论（**已脱敏**）。
        请勿提交第三方应用的代码、APK 或反编译产物。
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 功能建议
        - 兼容性验证结果（成功）
        - 兼容性差异 / 协议不一致
        - 文档改进
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 车型 / 车盒固件 / 手机系统
      placeholder: "车盒 1.2.2 / Android 16"
    validations:
      required: false
  - type: textarea
    id: detail
    attributes:
      label: 具体内容
      description: 建议做什么、解决什么问题；或实测协议与 docs/protocol.md 的差异
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 抓包 / 日志结论（已脱敏）
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 内容已脱敏，不含真实 MAC、序列号、CPU ID、密钥或个人信息
          required: true
        - label: 未附带任何第三方应用的代码 / APK / 反编译产物
          required: true
