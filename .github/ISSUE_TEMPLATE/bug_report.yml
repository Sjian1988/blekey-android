name: Bug 报告
description: 报告连接、指令、保活或界面异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先阅读 [SECURITY.md](../../SECURITY.md)。

        **日志、抓包和截图请务必脱敏**：MAC 地址、车机序列号、CPU ID、配对号、设备密钥、车牌与账号都要替换成占位值。
        请勿附上任何第三方应用的代码、APK 或反编译产物。
  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 界面底部或 `AndroidManifest.xml` 里的 versionName
      placeholder: "1.3"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: 手机 / 系统
      placeholder: "Redmi ... / Android 16 / HyperOS 3"
    validations:
      required: true
  - type: input
    id: car-box
    attributes:
      label: 车盒固件版本 / 车型（如已知）
      placeholder: "1.2.2"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从什么状态开始、做了什么、多久后出现
      placeholder: |
        1. 保持 App 在后台
        2. 靠近车辆
        3. 30 秒后仍未连接
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望 / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段（已脱敏）
      description: "`adb logcat -s BleKey` 或 App 内运行日志，保留帧 hex、删除设备标识"
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已删除日志 / 截图中的 MAC、序列号、CPU ID、密钥等真实值
          required: true
        - label: 我已确认电池白名单、自启动、通知权限均已开启
          required: false
        - label: 我已阅读 README 的范围与免责声明，仅用于本人自有车辆
          required: true
